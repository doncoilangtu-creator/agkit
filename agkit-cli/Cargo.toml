[package]
name = "agkit-cli"
version = "3.0.0"
edition = "2021"
description = "AGKit Durable Layer CLI — Manage SQLite databases for AGKit v3.0"
authors = ["Hoanghitech"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
opt-level = "s"
lto = true
strip = true
